name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
        include:
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # ShellBridgeTest drives /bin/zsh; macOS and Windows ship it (or need
      # nothing), Linux runners do not.
      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh

      - name: Syntax-check shell scripts (non-Windows)
        if: runner.os != 'Windows'
        run: |
          bash -n agent-launcher launchers/setup
          zsh -n launchers/shell-init/.zshenv launchers/shell-init/.zshrc \
                 launchers/shell-init/.zprofile launchers/shell-init/.zlogin

      - name: Run the suite
        run: python -m unittest -v
